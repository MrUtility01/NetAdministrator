name: Android CI
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract full Android source from package
        run: |
          unzip -o NetAdministrator_Android_GitHub_Ready_v1.0.0_FA.zip
          # Move contents of NetAdministratorAndroid to root (overwrite existing)
          cp -a NetAdministratorAndroid/. .
          rm -rf NetAdministratorAndroid
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NetAdministrator-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
