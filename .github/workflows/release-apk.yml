name: Publish Android test APK
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract full Android source from package
        run: |
          set -e
          if [ -f NetAdministrator_Android_GitHub_Ready_v1.0.0_FA.zip ]; then
            unzip -o -q NetAdministrator_Android_GitHub_Ready_v1.0.0_FA.zip
            if [ -d NetAdministratorAndroid ]; then
              cp -a NetAdministratorAndroid/. .
              rm -rf NetAdministratorAndroid
            fi
          fi

      - name: Ensure Compose SelectionContainer import
        shell: bash
        run: |
          set -euo pipefail
          MAIN_ACTIVITY="$(find app/src/main/java -type f -name 'MainActivity.kt' -print -quit)"
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.kt not found after source extraction."
            exit 1
          fi
          IMPORT_LINE='import androidx.compose.foundation.text.selection.SelectionContainer'
          if ! grep -Fxq "$IMPORT_LINE" "$MAIN_ACTIVITY"; then
            awk '
              BEGIN { inserted = 0 }
              /^package[[:space:]]/ {
                print
                if (!inserted) {
                  print ""
                  print "import androidx.compose.foundation.text.selection.SelectionContainer"
                  inserted = 1
                }
                next
              }
              { print }
              END { if (!inserted) exit 2 }
            ' "$MAIN_ACTIVITY" > "$MAIN_ACTIVITY.tmp"
            mv "$MAIN_ACTIVITY.tmp" "$MAIN_ACTIVITY"
          fi
          grep -nF "$IMPORT_LINE" "$MAIN_ACTIVITY"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build installable debug APK
        run: gradle assembleDebug --stacktrace

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
              --title "NetAdministrator Android $TAG" \
              --notes "Test APK generated by GitHub Actions from the full source package. Uses debug signing key — for testing only."
          else
            echo "workflow_dispatch finished. APK is available as artifact."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetAdministrator-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
