name: Publish Android test APK
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract full Android source from package
        run: |
          unzip -o NetAdministrator_Android_GitHub_Ready_v1.0.0_FA.zip
          cp -a NetAdministratorAndroid/. .
          rm -rf NetAdministratorAndroid
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Build installable debug APK
        run: gradle assembleDebug
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
              --title "NetAdministrator Android $TAG" \
              --notes "Test APK generated by GitHub Actions from the full source package. This build uses the debug signing key and is intended for testing."
          else
            echo "workflow_dispatch completed the build; the APK artifact is available in the workflow run."
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetAdministrator-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
